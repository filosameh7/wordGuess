<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="result-cont">
      <div id="result">
        <p></p>
        <button>Play Again</button>
      </div>
    </div>
    <h1>Guess The Word</h1>
    <div class="container">
      <div class="trials"></div>
      <div class="cont2">
        <h2>Key Colors</h2>
        <div class="cont3">
          <div class="guide">
            <span id="green"></span>
            <p>Letter Is Right And In Place</p>
          </div>
          <div class="guide">
            <span id="orange"></span>
            <p>Letter Is Right But Not In Place</p>
          </div>
          <div class="guide">
            <span id="black"></span>
            <p>Letter Is Wrong And Not Exists In Word</p>
          </div>
        </div>
      </div>
    </div>
    <script src="celebration/confetti-library.js"></script>
    <script src="main.js" type="module"></script>
  </body>
</html>
